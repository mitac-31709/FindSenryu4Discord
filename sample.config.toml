[discord]
token = ""
playing = ""
welcome_enabled = true  # サーバー参加時にウェルカムメッセージを送信するか
yome_max = 10  # 「n回詠め」の上限

[database]
driver = "sqlite3"  # sqlite3 or postgres
path = "data/senryu.db"
# dsn = "host=localhost user=findsenryu dbname=findsenryu sslmode=disable"

[log]
level = "info"  # debug, info, warn, error
format = "text"  # json, text

[admin]
owner_ids = []  # Bot admin Discord IDs
guild_id = ""   # Guild ID for admin commands
log_channel_id = ""        # リアルタイム通知送信先（サーバー参加/離脱）
report_channel_id = ""     # デイリーレポート送信先
contact_channel_id = ""    # /contact コマンドのお問い合わせ通知先

[server]
enabled = true
port = 9090

[backup]
enabled = false
interval_hour = 24
path = "data/backups"
max_backups = 7

[encryption]
# key = ""  # hex-encoded 32-byte AES-256 key (openssl rand -hex 32)

[import]
# Bot user IDs whose "川柳を検出しました！" replies are imported.
# Official bot example: 480281065588785162
# Empty = only this bot's own messages
# source_bot_ids = ["480281065588785162"]
